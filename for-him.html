<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Him — Mozafarian · Fine Jewellers Since 1821</title>
<meta name="description" content="The For Him collection at Mozafarian — gents' rings, fine timepieces and diamonds. Dubai & London.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
<link rel="stylesheet" href="./css/catalog.css">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/brand/icon-32.png">
<link rel="apple-touch-icon" href="./assets/brand/icon-180.png">
</head>
<body class="catalog-page" data-page="jewellery" data-gender="him">

  <main id="smooth-content">

    <section class="ed-hero ed-hero--collection">
      <div class="ed-hero__media"><img class="media-img" src="./assets/products/moz-100.jpg" alt="For Him" loading="eager"></div>
      <div class="ed-hero__inner">
        <span class="eyebrow">The Collection</span>
        <h1 class="ed-hero__title">For <em>him.</em></h1>
        <p class="ed-hero__sub">Gents' rings, exceptional timepieces and diamonds with presence — for the man who knows. Every piece offered on request.</p>
      </div>
    </section>

    <div class="cat-filters" id="catFilters">
      <span class="cat-count" id="catCount">&nbsp;</span>
    </div>

    <div class="cat-grid" id="catGrid">
      <div class="cat-loading">Loading the collection…</div>
    </div>
    <div class="cat-more" id="catMore"></div>

  </main>

  <script src="./js/shell.js"></script>
  <script src="./js/catalog.js"></script>
</body>
</html>
